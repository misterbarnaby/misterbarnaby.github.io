<h1>Barnaby</h1>
<p>Barnaby is a personal assistant used by one person, on their own computer. It is not a public service and cannot be used by anyone else.</p>
<p>It uses the Google Calendar API only to add events to its owner's own calendars, when the owner asks for it and says yes.</p>
